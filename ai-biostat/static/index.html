<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-Biostat — предварительный флоу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#F7FAFC; --surface:#FFFFFF; --ink:#1E2B37; --ink-2:#5E6E7D; --line:#E2E9EF; --line-2:#EEF3F7;
  --accent:#1A86AD; --accent-hover:#16779A; --accent-soft:#EAF6FB; --accent-line:#BFE3F1;
  --ok:#2F8A5F; --ok-soft:#EBF7F0; --warn:#A8670A; --warn-soft:#FDF5E7; --bad:#B8362C; --bad-soft:#FDEFED; --code-bg:#F4F8FA;
  --font:'Golos Text', 'Segoe UI', Roboto, Arial, sans-serif; --mono:'JetBrains Mono', Consolas, 'Courier New', monospace;
  --top-h:56px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:calc(var(--top-h) + env(safe-area-inset-top,0px)); -webkit-text-size-adjust:100%}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1{font-size:28px; line-height:1.2; margin:0 0 8px; font-weight:700; letter-spacing:-.01em}
h2{font-size:20px; line-height:1.3; margin:0 0 8px; font-weight:600}
h3{font-size:16px; margin:0 0 8px; font-weight:600}
p{margin:0 0 12px; max-width:68ch}
.muted{color:var(--ink-2)}
.small{font-size:13px}
/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; gap:14px; min-height:var(--top-h); padding:8px 20px; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.brand{font-weight:700; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; white-space:nowrap}
.mark{width:30px; height:30px; border-radius:8px; background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line); display:grid; place-items:center; font-size:12px; font-weight:700}
.top .grow{flex:1}
.top .ctx{display:flex; align-items:center; gap:12px; min-width:0}
.top .ctx .btn{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:320px}
.lang{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex:none}
.lang button{border:0; background:transparent; padding:6px 11px; font-size:13px; min-width:40px}
.lang button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.ver{font-size:12px; color:var(--warn); background:var(--warn-soft); padding:3px 9px; border-radius:6px; white-space:nowrap}
/* layout */
.wrap{max-width:1180px; margin:0 auto; padding:28px 20px 60px}
.center{max-width:440px; margin:6vh auto 40px; padding:0 20px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px}
.btn{border:1px solid var(--line); background:var(--surface); padding:10px 16px; min-height:42px; border-radius:10px; font-weight:500; transition:background .15s, border-color .15s}
.btn:hover:not(:disabled){border-color:var(--accent-line); background:var(--accent-soft)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--accent-hover); border-color:var(--accent-hover)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.ghost{border-color:transparent; background:transparent; color:var(--accent); padding-left:0; min-height:auto}
.btn.ghost:hover:not(:disabled){background:transparent; text-decoration:underline}
.hint{font-size:13px; color:var(--ink-2); margin-top:6px}
label.f{display:block; font-size:13px; color:var(--ink-2); margin:14px 0 6px}
input.t, textarea.t, select.t{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface); min-height:44px}
input.t:focus, textarea.t:focus, select.t:focus{border-color:var(--accent-line); outline:2px solid var(--accent-soft); outline-offset:0}
textarea.t{min-height:120px; resize:vertical; line-height:1.55}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.spread{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
/* role cards */
.roles{display:grid; gap:12px; margin-top:16px}
.role{text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:16px 18px}
.role[aria-pressed="true"]{border-color:var(--accent-line); box-shadow:inset 0 0 0 1px var(--accent-line); background:var(--accent-soft)}
.role b{display:block; font-size:16px; margin-bottom:2px}
/* diagnostics */
.bar{height:6px; background:var(--line-2); border-radius:3px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:3px}
.opts{display:grid; gap:8px; margin:16px 0}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px; min-height:46px}
.opt[aria-checked="true"]{border-color:var(--accent-line); background:var(--accent-soft)}
.opt .dot{width:18px; height:18px; border-radius:50%; border:1.5px solid #9AA9B6; flex:none; margin-top:2px; background:var(--surface)}
.opt[aria-checked="true"] .dot{border:5px solid var(--accent)}
.opt.wrong{border-color:#F0C2BD; background:var(--bad-soft)}
/* home */
.home{display:grid; grid-template-columns:200px 1fr; gap:28px}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{text-align:left; border:0; background:transparent; padding:9px 12px; border-radius:9px; color:var(--ink); min-height:40px}
.nav button[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.cont{border:1px solid var(--accent-line); background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%); border-radius:16px; padding:22px; display:flex; gap:20px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.cont .bar{width:260px; max-width:100%; margin-top:10px; background:#fff}
.comps{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:24px 0}
.comp{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.comp b{font-size:20px; display:block; margin:2px 0 6px}
.cases{display:grid; gap:8px}
.case{display:grid; grid-template-columns:44px 1fr auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; text-align:left}
.case .n{font-weight:700; color:var(--accent); font-size:18px}
.case.locked{opacity:.55}
.tag{font-size:12px; padding:2px 8px; border-radius:6px; background:var(--paper); border:1px solid var(--line); white-space:nowrap}
/* player */
.player{display:grid; grid-template-columns:220px minmax(0,1fr) 310px; min-height:calc(100vh - var(--top-h))}
.steps{border-right:1px solid var(--line); background:var(--surface); padding:16px 10px}
.steps ol{list-style:none; margin:0; padding:0}
.steps button{display:flex; gap:10px; align-items:center; width:100%; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:9px; min-height:38px}
.steps button[aria-current="step"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.steps button:disabled{color:#9AA9B6; cursor:default}
.sd{width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:11px; border:1.5px solid var(--line); color:var(--ink-2); background:var(--surface)}
.sd.done{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); font-weight:700}
.sd.cur{border-color:var(--accent); color:var(--accent); font-weight:700}
.mstep{display:none}
.stage{padding:28px 32px 40px; min-width:0}
.stage h2{font-size:22px}
.foot{position:sticky; bottom:0; background:linear-gradient(to top, var(--paper) 75%, rgba(247,250,252,0)); padding:18px 0 10px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-top:24px; z-index:3}
.foot .why{font-size:13px; color:var(--ink-2); text-align:right; margin-top:6px}
.foot .kbd{font-size:12px; color:#9AA9B6; text-align:right; margin-top:4px}
.tutor{border-left:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; height:calc(100vh - var(--top-h)); position:sticky; top:var(--top-h)}
.tutor header{padding:14px 16px 10px; border-bottom:1px solid var(--line)}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.chip{font-size:12px; padding:2px 9px; border:1px solid var(--line); border-radius:12px; color:var(--ink-2); background:var(--surface)}
.msgs{flex:1; overflow:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.msg{padding:10px 12px; border-radius:12px; font-size:14px; background:var(--paper); border:1px solid var(--line-2); max-width:92%}
.msg.me{align-self:flex-end; background:var(--accent-soft); border-color:var(--accent-line)}
.quick{display:flex; flex-direction:column; gap:6px; padding:0 16px 10px}
.quick button{text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 11px; font-size:13px; min-height:38px}
.quick button:hover{background:var(--accent-soft); border-color:var(--accent-line)}
.ask{display:flex; gap:6px; padding:10px 16px 14px; border-top:1px solid var(--line)}
.ask input{flex:1}
.locked-ai{margin:16px; padding:14px; border-radius:12px; background:var(--paper); border:1px dashed var(--line); color:var(--ink-2); font-size:14px}
.tutor-fab,.backdrop,#tclose{display:none}
/* data */
.tbl{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:8px 12px; border-bottom:1px solid var(--line-2); text-align:left; white-space:nowrap}
th{background:var(--paper); font-weight:600; font-size:13px; color:var(--ink-2)}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--accent-soft)}
tr.flag td{background:var(--warn-soft)}
td.num{font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--accent-line); background:var(--accent-soft); padding:10px 14px; border-radius:0 10px 10px 0; margin:14px 0; font-size:14px; max-width:72ch}
.note.warn{border-color:#EBC98C; background:var(--warn-soft)}
.note.ok{border-color:#A9D9BF; background:var(--ok-soft)}
.note.bad{border-color:#F0C2BD; background:var(--bad-soft)}
.types{display:grid; grid-template-columns:1fr 220px 90px; gap:8px 14px; align-items:center; max-width:680px}
.types .h{font-size:13px; color:var(--ink-2)}
code,.code{font-family:var(--mono); font-size:13.5px}
.editor{background:var(--code-bg); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-family:var(--mono); font-size:13.5px; line-height:1.9; overflow-x:auto; white-space:pre; -webkit-overflow-scrolling:touch}
.editor input{font-family:var(--mono); font-size:13px; width:130px; border:1px dashed var(--accent); background:var(--surface); border-radius:6px; padding:2px 6px}
.editor textarea{width:100%; min-height:150px; border:0; background:transparent; font-family:var(--mono); font-size:13.5px; line-height:1.7; resize:vertical}
.out{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-family:var(--mono); font-size:13px; white-space:pre; overflow-x:auto; margin-top:12px}
.stages{display:grid; gap:6px; margin-top:12px; font-size:14px}
.stages div{display:flex; gap:8px; align-items:center; color:var(--ink-2)}
.stages div.on{color:var(--ink); font-weight:500}
.stages div.ok::before{content:"✓"; color:var(--ok); font-weight:700}
.stages div.on::before{content:"•"; color:var(--accent); font-weight:700}
.stages div.wait::before{content:"○"}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{border:0; background:var(--surface); padding:7px 16px; font-size:13px; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.check{list-style:none; padding:0; margin:10px 0 0; display:grid; gap:4px; font-size:14px}
.check li::before{content:"○ "; color:#9AA9B6}
.check li.yes::before{content:"✓ "; color:var(--ok); font-weight:700}
.aiq{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; line-height:2; max-width:72ch}
.aiq .frag{border-radius:4px; padding:3px 2px; cursor:pointer; border-bottom:1px dashed #9AA9B6}
.aiq .frag:hover{background:var(--accent-soft)}
.aiq .frag.sel{background:var(--warn-soft); border-bottom:2px solid var(--warn)}
.score{font-size:44px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
.cards3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0}
.c3{border-radius:14px; padding:14px 16px; border:1px solid var(--line); background:var(--surface)}
.c3.g{border-top:3px solid #7CC5A0} .c3.o{border-top:3px solid #E7B866} .c3.b{border-top:3px solid #7FC4DE}
.c3 ul{margin:6px 0 0; padding-left:18px; font-size:14px}
.modal{position:fixed; inset:0; background:rgba(30,43,55,.35); display:grid; place-items:center; padding:20px; z-index:30}
.modal .panel{max-width:520px; width:100%; max-height:90vh; overflow:auto}
.sbar{display:grid; grid-template-columns:1fr 64px; gap:10px; align-items:center; font-size:14px; max-width:520px}
.qrow{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line-2)}
.qrow:last-child{border-bottom:0}
.hbars{display:grid; gap:10px; margin-top:14px; max-width:560px}
.hb{display:grid; grid-template-columns:170px 1fr 52px; gap:10px; align-items:center; font-size:14px}
.hbt{height:16px; background:var(--line-2); border-radius:4px; overflow:hidden}
.hbt i{display:block; height:100%; background:#7FC4DE; border-radius:4px}
@media (max-width:600px){ .hb{grid-template-columns:1fr 52px} .hb span{grid-column:1/-1} }
.edu{font-size:13px; color:var(--ink-2); background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent-line); border-radius:0 10px 10px 0; padding:8px 12px; margin:0 0 18px; max-width:72ch}
.grade{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.grade .lt{font-size:26px; font-weight:700; color:var(--accent)}
.ext{display:flex; flex-direction:column; gap:10px; padding:16px}
.ext .btn{width:100%}
.ext ol{margin:0; padding-left:18px; font-size:14px; color:var(--ink-2)}
.copyq{display:flex; justify-content:space-between; gap:8px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:7px 10px; font-size:13px; background:var(--surface); text-align:left; width:100%}
.copyq span:last-child{color:var(--accent); font-size:12px; white-space:nowrap}
.form{display:grid; gap:4px; max-width:640px}
/* ---------- tablet & mobile ---------- */
@media (max-width:980px){
  .player{grid-template-columns:1fr; min-height:auto}
  .steps{display:none}
  .mstep{display:block; position:sticky; top:calc(var(--top-h) + env(safe-area-inset-top,0px)); z-index:4; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 16px}
  .mstep .seg10{display:grid; grid-template-columns:repeat(10,1fr); gap:3px; margin-top:6px}
  .mstep .seg10 button{height:6px; border:0; border-radius:3px; background:var(--line-2); padding:0}
  .mstep .seg10 button.done{background:var(--accent-line)}
  .mstep .seg10 button.cur{background:var(--accent)}
  .stage{padding:20px 16px 110px}
  .foot{position:fixed; left:0; right:0; bottom:0; margin:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--surface); border-top:1px solid var(--line); align-items:center}
  .foot .kbd{display:none}
  .foot > div:last-child{flex:1; display:flex; flex-direction:column; align-items:stretch}
  .foot .btn.primary{width:100%}
  .foot .why{text-align:center}
  .tutor{position:fixed; left:0; right:0; bottom:0; top:auto; height:78vh; border-left:0; border-top:1px solid var(--line); border-radius:18px 18px 0 0; transform:translateY(105%); transition:transform .22s ease; z-index:25; padding-bottom:env(safe-area-inset-bottom,0px); box-shadow:0 -8px 30px rgba(30,43,55,.12)}
  .tutor.open{transform:none}
  .tutor header::before{content:""; display:block; width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 10px}
  .backdrop.open{display:block; position:fixed; inset:0; background:rgba(30,43,55,.3); z-index:24}
  #tclose{display:inline-block}
  .tutor-fab{display:flex; align-items:center; gap:6px; position:fixed; right:16px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:20; border-radius:24px; padding:10px 16px; background:var(--surface); color:var(--accent); border:1px solid var(--accent-line); font-weight:600; box-shadow:0 4px 16px rgba(30,43,55,.12)}
  .home{grid-template-columns:1fr; gap:16px}
  .nav{flex-direction:row; overflow-x:auto; gap:6px; margin:0 -20px; padding:0 20px 4px; scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap; border:1px solid var(--line); background:var(--surface); flex:none}
  .comps{grid-template-columns:repeat(2,1fr)}
  .cards3{grid-template-columns:1fr}
}
@media (max-width:600px){
  :root{--top-h:52px}
  body{font-size:16px}
  h1{font-size:24px} .stage h2{font-size:19px}
  .top{padding:6px 12px; gap:8px}
  .top .ver,.brand .bname{display:none}
  .top .ctx .btn{max-width:150px; font-size:14px}
  .top .ctx .stepof{display:none}
  .wrap{padding:18px 16px 40px}
  .center{margin:24px auto; padding:0 16px}
  .panel{padding:18px; border-radius:14px}
  input.t,textarea.t,select.t{font-size:16px}
  .cont{padding:18px; flex-direction:column; align-items:stretch}
  .cont .btn{width:100%}
  .cont .bar{width:100%}
  .case{grid-template-columns:32px 1fr; padding:12px 14px}
  .case .tag{grid-column:2; justify-self:start}
  .types{grid-template-columns:1fr; gap:4px; max-width:none}
  .types .h{display:none}
  .types > span:not(.h){margin-top:12px; font-weight:500}
  .types label{justify-self:start}
  .score{font-size:36px}
  .spread > .btn:not(.ghost){width:100%}
  .qrow{grid-template-columns:1fr}
  .qrow .row .btn{flex:1}
  .modal{align-items:end; padding:0}
  .modal .panel{border-radius:18px 18px 0 0; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .aiq{padding:14px 16px}
  th,td{padding:8px 10px}
}
@media (prefers-reduced-motion: reduce){ .tutor{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
/* ---------- i18n: интерфейс RU / KZ (содержание кейсов пока на русском) ---------- */
const T={
 ru:{login:'Вход в AI-Biostat',code:'Код участника',otp:'Одноразовый пароль',enter:'Войти',next:'Далее',back:'Назад',home:'Главная',cases:'Мои кейсы',progress:'Мой прогресс',aicheck:'Проверка ИИ',tutor:'Репетитор',cont:'Продолжить',run:'Запустить',check:'Проверить',finish:'Завершить кейс',ask:'Спросить…',logout:'Выйти'},
 en:{login:'Sign in to AI-Biostat',code:'Participant code',otp:'One-time password',enter:'Sign in',next:'Next',back:'Back',home:'Home',cases:'My cases',progress:'My progress',aicheck:'AI check',tutor:'AI tutor',cont:'Continue',run:'Run',check:'Check',finish:'Finish case',ask:'Ask…',logout:'Sign out'},
 kk:{login:'AI-Biostat жүйесіне кіру',code:'Қатысушы коды',otp:'Бір реттік құпиясөз',enter:'Кіру',next:'Келесі',back:'Артқа',home:'Басты бет',cases:'Менің кейстерім',progress:'Менің прогресім',aicheck:'ЖИ тексеру',tutor:'Репетитор',cont:'Жалғастыру',run:'Іске қосу',check:'Тексеру',finish:'Кейсті аяқтау',ask:'Сұрақ қою…',logout:'Шығу'}
};
/* ---------- синтетические данные кейса 21 (воспроизводят опубликованные доли) ---------- */
function rng(seed){return function(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
const R=rng(21);
const groups=[['Самозанятые',156,30],['Домохозяйки',70,21],['Работающие по найму',94,6]];
let rows=[];

 on('#tclose','click',()=>{S.tutorOpen=false;render()});
 return `<aside class="tutor ${S.tutorOpen?'open':''}" aria-label="ИИ-репетитор"><header><div class="spread"><b>${t('tutor')}</b><button class="btn ghost small" id="tclose" aria-label="Свернуть">✕</button></div>
 <div class="chips"><span class="chip">Кейс 21</span><span class="chip">Шаг ${c.step}</span><span class="chip">case21_hiv_employment.csv</span></div></header>
 ${blocked?`<div class="locked-ai">${blocked}</div>`:`<div class="ext"><p class="small" style="margin:0">В пилоте репетитор открывается в отдельной вкладке. Ваши ответы и оценки сохраняются только здесь, в AI-Biostat.</p>
 <a class="btn primary" id="openTutor" href="${TUTOR_URL}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Открыть ИИ-репетитор ↗</a>
 <ol><li>Скопируйте вопрос ниже или задайте свой</li><li>Получите консультацию</li><li>Вернитесь на эту вкладку — шаг сохранён</li></ol>
 <b class="small" style="margin-top:6px">О чём можно спросить на этом шаге</b>
 ${(QUICK[c.step]||['Как подойти к этому шагу?']).map(q=>`<button class="copyq" data-q="${esc(q)}"><span>${q}</span><span>Копировать</span></button>`).join('')}</div>`}
 <div class="small muted" style="padding:10px 16px 14px;margin-top:auto">Переходов к репетитору: <span id="tcount">${c.hints}</span> · учитывается в исследовании</div></aside>`}
function gradeOf(x){const G=[[95,'A','отлично'],[90,'A−','отлично'],[85,'B+','хорошо'],[80,'B','хорошо'],[75,'B−','хорошо'],[70,'C+','хорошо'],[65,'C','удовлетворительно'],[60,'C−','удовлетворительно'],[55,'D+','удовлетворительно'],[50,'D','удовлетворительно'],[25,'FX','неудовлетворительно'],[0,'F','неудовлетворительно']];return G.find(g=>x>=g[0])}
function gradeHtml(x){const g=gradeOf(x);return `<div class="grade"><span class="lt">${g[1]}</span><span class="muted">${g[2]}</span></div>`}

/* ---------- 6. преподаватель / автор ---------- */
const CASES_ADM=[[1,'Вспышка кори на учебной территории: оценка 7-1-7','0.1','Проверка биостатистиком'],[4,'Неонатальный сепсис: случай-контроль','0.1','Проверка биостатистиком'],[21,'ВИЧ-инфекция и занятость','0.2','Опубликован'],[22,'Стадия ВИЧ-инфекции и вирусная супрессия','0.1','Черновик'],[23,'Пропуск приёма АРТ и вирусная супрессия','0.1','Проверка эксперта по мед. образованию']];
function teacher(){
 S.tTab=S.tTab||'review';
 on('[data-tt]','click',e=>{S.tTab=e.currentTarget.dataset.tt;S.edit=false;render()});
 on('.qact','click',e=>{e.currentTarget.closest('.qrow').innerHTML='<span class="small" style="color:var(--ok)">Решение и обоснование сохранены и отправлены студенту</span>'});
 on('#out','click',logout);
 on('#newcase','click',()=>{S.edit=true;render()});
 on('#cancel','click',()=>{S.edit=false;render()});
 const nav=[['review',`Проверка${S.tData&&S.tData.disputes.length?` <span class="tag">${S.tData.disputes.length}</span>`:''}`],['editor','Редактор кейсов'],['diag','Диагностика'],['groups','Участники и выгрузка']].map(([k,l])=>`<button data-tt="${k}" ${S.tTab===k?'aria-current="page"':''}>${l}</button>`).join('');
 let body='';
 if(S.tTab==='review'||S.tTab==='groups'){if(!S.tData&&!S.tLoading){S.tLoading=true;api('GET','/api/teacher/overview').then(d=>{S.tData=d;S.tLoading=false;render()}).catch(e=>{S.tLoading=false;S.tData={people:[],disputes:[],err:e.message};render()})}}
 const TD=S.tData||{people:[],disputes:[]};
 on('[data-res]','click',e=>{const id=e.currentTarget.dataset.res,dec=e.currentTarget.dataset.dec,row=e.currentTarget.closest('.qrow'),reason=row.querySelector('textarea').value.trim(),ns=row.querySelector('input').value;
   if(!reason){row.querySelector('textarea').focus();return}
   api('POST','/api/teacher/disputes/'+id,{decision:dec,new_score:dec==='change'&&ns!==''?+ns:null,reason}).then(()=>{S.tData=null;render()}).catch(er=>alert(er.message))});
 on('[data-conf]','click',e=>{const [code,cs]=e.currentTarget.dataset.conf.split('|');api('POST',`/api/teacher/confirm/${code}/${cs}`).then(()=>{S.tData=null;render()})});
 on('#refresh','click',()=>{S.tData=null;render()});
 const pend=TD.people.filter(p=>p.status==='completed');
 if(S.tTab==='review') body=`<div class="spread"><h1>Проверка</h1><button class="btn" id="refresh">Обновить</button></div><p class="muted">Сначала — оспариваемые оценки. Оспаривание не блокирует студента; решение и обоснование он увидит.</p>
 ${TD.err?`<div class="note bad">${esc(TD.err)}</div>`:''}${!S.tData?'<p class="muted">Загрузка…</p>':''}
 <h3>Оспаривания (${TD.disputes.length})</h3><div class="panel">${TD.disputes.length?TD.disputes.map(d=>`<div class="qrow" style="grid-template-columns:1fr"><div><b>${esc(d.code)} · кейс ${esc(d.case_id)} · ${esc(d.step)}</b> <span class="tag" style="color:var(--bad)">Оспаривается</span>
   <div class="small muted">Оценка ИИ за кейс: ${d.ai_score??'—'} · «${esc(d.text)}»</div></div>
   <div class="row"><input class="t" type="number" min="0" max="100" placeholder="Новый балл" style="width:140px"><textarea class="t" style="min-height:44px;flex:1" placeholder="Обоснование решения (обязательно)"></textarea></div>
   <div class="row"><button class="btn" data-res="${d.id}" data-dec="keep">Оставить оценку</button><button class="btn primary" data-res="${d.id}" data-dec="change">Изменить балл</button></div></div>`).join(''):'<p class="muted small" style="margin:0">Открытых оспариваний нет.</p>'}</div>
 <h3 style="margin-top:22px">Ждут подтверждения (${pend.length})</h3><div class="panel">${pend.length?pend.map(p=>`<div class="qrow"><div><b>${esc(p.code)} · кейс ${esc(p.case_id)}</b> <span class="tag">Предварительная</span><div class="small muted">${p.score??'—'} баллов · ${p.grade??''}</div></div><button class="btn primary" data-conf="${esc(p.code)}|${esc(p.case_id)}">Подтвердить</button></div>`).join(''):'<p class="muted small" style="margin:0">Нет работ, ожидающих подтверждения.</p>'}</div>`;
 if(S.tTab==='editor'&&!S.edit) body=`<div class="spread"><h1>Редактор кейсов</h1><button class="btn primary" id="newcase">Создать кейс</button></div>
 <p class="muted">Кейс публикуется только после проверки ключа биостатистиком и содержания — экспертом по медицинскому образованию. Решение о публикации принимает автор.</p>
 <div class="tbl"><table><thead><tr><th>№</th><th>Кейс</th><th>Версия</th><th>Статус</th></tr></thead><tbody>${CASES_ADM.map(([n,ti,v,st])=>`<tr><td>${n}</td><td>${ti}</td><td>${v}</td><td><span class="tag" style="${st==='Опубликован'?'color:var(--ok)':st==='Черновик'?'':'color:var(--warn)'}">${st}</span></td></tr>`).join('')}</tbody></table></div>`;
 if(S.tTab==='editor'&&S.edit) body=`<h1>Новый кейс</h1><p class="muted">Черновик сохраняется автоматически. Перед отправкой на проверку можно открыть кейс глазами студента.</p>
 <div class="panel form">
 <label class="f">Название</label><input class="t" placeholder="Например: Пропуск приёма АРТ и вирусная супрессия">
 <div class="row"><div style="flex:1;min-width:180px"><label class="f">Уровень</label><select class="t"><option>Базовый</option><option>Сложный</option></select></div><div style="flex:1;min-width:180px"><label class="f">Язык версии</label><select class="t"><option>Русский</option><option>Қазақша</option><option>English</option></select></div></div>
 <label class="f">Ситуация (шаг 1)</label><textarea class="t" placeholder="Роль обучающегося и профессиональная задача"></textarea>
 <label class="f">Учебные данные (CSV / Excel)</label><input class="t" type="file" accept=".csv,.xlsx">
 <p class="hint">Пометка «Учебные данные» добавляется автоматически. Реальные названия территорий и организаций не используются.</p>
 <label class="f">Словарь переменных и эталон типов (шаг 3)</label><textarea class="t" style="min-height:80px" placeholder="переменная — описание — тип — единицы"></textarea>
 <label class="f">Ошибки в данных для шага 2</label><textarea class="t" style="min-height:70px"></textarea>
 <label class="f">Правильный метод и дистракторы (шаг 5)</label><textarea class="t" style="min-height:70px"></textarea>
 <label class="f">Эталонный код R и Python (шаг 6)</label><textarea class="t code" style="min-height:100px"></textarea>
 <label class="f">Эталонный вывод и рубрика (шаг 7)</label><textarea class="t" style="min-height:80px"></textarea>
 <label class="f">Ловушка ИИ (шаг 8)</label><textarea class="t" style="min-height:70px"></textarea>
 <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn" id="cancel">Отмена</button><button class="btn">Предпросмотр как студент</button><button class="btn primary">Отправить на проверку</button></div></div>`;
 if(S.tTab==='diag') body=`<h1>Диагностика</h1><p class="muted">Два параллельных варианта по 20 заданий с одинаковой структурой: вариант А — входная, вариант Б — итоговая диагностика.</p>
 <div class="tbl"><table><thead><tr><th>Компетенция</th><th>Вариант А</th><th>Вариант Б</th></tr></thead><tbody><tr><td>Биостатистика</td><td>6</td><td>6</td></tr><tr><td>Работа с данными</td><td>5</td><td>5</td></tr><tr><td>Интерпретация</td><td>5</td><td>5</td></tr><tr><td>Работа с ИИ</td><td>4</td><td>4</td></tr><tr><td><b>Всего</b></td><td><b>20</b></td><td><b>20</b></td></tr></tbody></table></div>
 <p class="small muted" style="margin-top:10px">Распределение заданий по компетенциям — предварительное, утверждает автор.</p>`;
 if(S.tTab==='groups'){const st={in_progress:'В процессе',completed:'Завершён',disputed:'Оспаривается',confirmed:'Подтверждён'};
 body=`<div class="spread"><h1>Участники и выгрузка</h1><button class="btn" id="refresh">Обновить</button></div>
 <div class="row" style="margin:6px 0 16px">${['attempts','events','diagnostics','disputes'].map(k=>`<a class="btn" href="/api/teacher/export/${k}.csv">${{attempts:'Результаты кейсов',events:'События (ИИ, код, шаги)',diagnostics:'Диагностика',disputes:'Оспаривания'}[k]} · CSV</a>`).join('')}</div>
 <div class="tbl"><table><thead><tr><th>Код</th><th>Группа</th><th>Роль</th><th>Кейс</th><th>Шаг</th><th>Баллы</th><th>Статус</th><th>Переходы к ИИ</th></tr></thead><tbody>
 ${TD.people.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.grp||'')}</td><td>${p.role==='specialist'?'специалист':'студент'}</td><td>${p.case_id?esc(p.case_id):'—'}</td><td>${p.max_step??'—'}</td><td>${p.score??'—'} ${p.grade?'· '+esc(p.grade):''}</td><td>${p.status?st[p.status]||p.status:'не начат'}</td><td>${p.tutor_opens||0}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Нет участников</td></tr>'}</tbody></table></div>
 <p class="small muted" style="margin-top:10px">В выгрузках только коды участников. Таблица «код — ФИО» хранится у автора исследования отдельно.</p>`}
 return top(`<button class="btn ghost small" id="out">${t('logout')}</button>`)+`<main class="wrap home"><nav class="nav">${nav}</nav><div>${body}</div></main>`}

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){const b=$('#nx');if(b&&!b.disabled)b.click()}
 if((e.ctrlKey||e.metaKey)&&(e.key==='l'||e.key==='L')&&S.screen==='player'){e.preventDefault();S.tutorOpen=!S.tutorOpen;render()}});
boot();
})();
</script>
</body>
</html>
